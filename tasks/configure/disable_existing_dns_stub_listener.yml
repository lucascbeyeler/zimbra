---
- name: Disable local resolver
  community.general.ini_file:
    path: /etc/systemd/resolved.conf
    section: Resolve
    option: DNSStubListener
    value: "no"
    no_extra_spaces: true
    mode: "0644"
  notify: Restart systemd-resolved

- name: Point /etc/resolv.conf to the upstream DNS servers
  ansible.builtin.file:
    path: /etc/resolv.conf
    src: /run/systemd/resolve/resolv.conf
    state: link
    force: true

# Port 53 must be free before zimbra-dnscache is installed or restarted
- name: Applying the systemd-resolved changes
  ansible.builtin.meta: flush_handlers
