---
#
# Download and install Zimbra OSE
################################################################################
- name: Checking there is a build for this distribution of Zimbra OSE {{ zimbra_version }}
  ansible.builtin.assert:
    that:
      - zimbra_build | length > 0
    fail_msg: >-
      zm_repo has no Zimbra OSE {{ zimbra_version }} build for
      {{ ansible_distribution }} {{ ansible_distribution_major_version }}
    quiet: true

- name: Update /etc/hosts
  ansible.builtin.lineinfile:
    path: /etc/hosts
    line: "{{ item }}"
    state: present
  loop: "{{ hosts_lines }}"
  when: hosts_lines is defined

- name: Download and unpacking Zimbra OSE {{ zimbra_version }}
  ansible.builtin.unarchive:
    src: "{{ zm_repo[zimbra_version | string].url }}{{ zimbra_build }}.tgz"
    dest: /usr/local/src/
    remote_src: true
    validate_certs: "{{ zimbra_download_validate_certs }}"
    creates: /usr/local/src/{{ zimbra_build }}/install.sh

# The installer files have every password, so only root can read them
- name: Create the folder to upload the scripts
  ansible.builtin.file:
    path: /tmp/zcs
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Uploading keystroke file
  ansible.builtin.template:
    src: "{{ 'installZimbraUpgrade-keystrokes' if zimbra_upgrade | zimbra_bool else 'installZimbra-keystrokes' }}"
    dest: /tmp/zcs/installZimbra-keystrokes
    owner: root
    group: root
    mode: "0600"

- name: Uploading installer configuration file
  ansible.builtin.template:
    src: "{{ 'installZimbraScriptUpgrade.j2' if zimbra_upgrade | zimbra_bool else 'installZimbraScript.j2' }}"
    dest: /tmp/zcs/installZimbraScript
    owner: root
    group: root
    mode: "0600"

- name: Installing Zimbra OSE {{ zimbra_version }}
  ansible.builtin.shell: ./install.sh -s < /tmp/zcs/installZimbra-keystrokes
  args:
    chdir: /usr/local/src/{{ zimbra_build }}/
  changed_when: true

- name: Configuring Zimbra OSE's services for use
  ansible.builtin.command: ./zmsetup.pl -c /tmp/zcs/installZimbraScript
  args:
    chdir: /opt/zimbra/libexec/
  changed_when: true
  notify: Restart Zimbra

- name: Removing the installer files
  ansible.builtin.file:
    path: /tmp/zcs
    state: absent
