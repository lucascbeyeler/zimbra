---
#
# Installing dependencies and removing other smtp servers
################################################################################
- name: Ensure Sendmail and Postfix is not installed
  ansible.builtin.package:
    name: "{{ absent }}"
    state: absent

- name: Ensure Pyzor and Razor is installed (CentOS/RedHat)
  ansible.builtin.dnf:
    name: "{{ centos }}"
    state: present
  when: ansible_os_family == "RedHat"

# Razor and Pyzor live in Ubuntu's universe component, which minimal and cloud
# images of Ubuntu Server often ship without
- name: Enabling the universe repository (Ubuntu)
  when: ansible_distribution == "Ubuntu"
  block:
    - name: Checking if Razor can be installed
      ansible.builtin.command: apt-cache show razor
      register: apt_cache_razor
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Installing add-apt-repository
      ansible.builtin.apt:
        name: software-properties-common
        state: present
        update_cache: true
      when: apt_cache_razor.rc != 0

    # add-apt-repository updates the APT cache as well
    - name: Enabling the universe repository
      ansible.builtin.command: add-apt-repository -y universe
      changed_when: true
      when: apt_cache_razor.rc != 0

- name: Ensure Pyzor and Razor is installed (Ubuntu)
  ansible.builtin.apt:
    name: "{{ ubuntu }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: ansible_os_family == "Debian"
