---
name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-unit-tests:
    runs-on: ubuntu-latest
    steps:
      # tests/test.yml finds the role by its folder name
      - uses: actions/checkout@v4
        with:
          path: zimbra
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ansible
        run: pip install -r zimbra/requirements.txt
      - name: Install the collections
        working-directory: zimbra
        run: ansible-galaxy collection install -r requirements.yml
      - name: Create ansible.cfg
        working-directory: zimbra
        run: printf '[defaults]\nroles_path=../\n' > ansible.cfg
      - name: Lint the role
        working-directory: zimbra
        run: ansible-lint
      - name: Syntax check
        working-directory: zimbra
        run: ansible-playbook -i tests/inventory tests/test.yml --syntax-check
      - name: Unit tests
        working-directory: zimbra
        run: ansible-playbook tests/unit/main.yml

  molecule:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Molecule
        run: |
          pip install -r requirements.txt
          ansible-galaxy collection install -r requirements.yml community.docker
      - name: Run Molecule
        run: molecule test
