---
absent:
  - postfix
  - sendmail

ubuntu:
  - razor
  - pyzor

centos:
  - pyzor
  - perl-Razor-Agent

#
# Products to be installed
################################################################################
zimbra_ldap: y
zimbra_logger: y
zimbra_mta: y
zimbra_dnscache: n
zimbra_snmp: n
zimbra_store: y
zimbra_apache: y
zimbra_spell: y
zimbra_memcached: y
zimbra_proxy: y
zimbra_policyd: n
zimbra_zmbackup: n

#
# Zimbra configuration
################################################################################

hostname: "localhost"
domain: "localdomain"
zmpasswd: "!23Change"
zmnetwork: "192.168.200.0/24"
timezone: UTC
# hosts_lines:
#   - "198.162.1.3 {{ hostname }}.{{ domain }} {{ hostname }}"
disable_existing_dns_stub_listener: n

#
# Firewall
################################################################################
# Open the ports of the enabled services in firewalld (Red Hat family) or ufw
# (Ubuntu). The firewall must already be installed; the role does not install,
# enable or start it.
zimbra_firewall: n
# Also open the admin console (7071, and 9071 through the proxy)
zimbra_firewall_admin: y
# firewalld zone the ports are opened in; empty for the default zone
zimbra_firewall_zone: ""
# Other ports to open, like "389/tcp" for the LDAP of a multi-server setup
zimbra_firewall_extra_ports: []

#
# Anti-spam
################################################################################
# DNS blocklists Postfix checks before accepting a message
zimbra_rbls:
  - zen.spamhaus.org
  - bl.spamcop.net

# Blocklists that were shut down and are removed if an older version of this
# role added them
zimbra_rbls_absent:
  - dsn.rfc-ignorant.org
  - dnsbl.sorbs.net

# Kevin McGrail's SpamAssassin rules
zimbra_kam_url: https://www.pccc.com/downloads/SpamAssassin/contrib/KAM.cf

#
# Zimbra installers
################################################################################
# Zimbra 10.0 or newer. Zimbra does not publish the installers of the Open
# Source Edition, so set zm_repo with the builds of this version
zimbra_version: 10.1.15

# Validate the TLS certificate of the server the installer is downloaded from
zimbra_download_validate_certs: true

# Installer builds of each version, like:
# zm_repo:
#   10.1.15:
#     url: https://downloads.example.com/zimbra/10.1.15/
#     builds:
#       ubuntu:
#         22: zcs-10.1.15_GA_0425.UBUNTU22_64.20250624000000
#       rocky:
#         9: zcs-10.1.15_GA_0425.RHEL9_64.20250624000000
zm_repo: {}

zimbra_upgrade: n

#
# Zmbackup - only used when zimbra_zmbackup is "y"
################################################################################
zmbackup_repo: https://github.com/lucascbeyeler/zmbackup.git
zmbackup_version: "2.0"
zmbackup_src_dir: /usr/local/src/zmbackup
zmbackup_server_address: "{{ hostname }}.{{ domain }}"
zmbackup_admin_user: "admin@{{ domain }}"
zmbackup_admin_password: "{{ zmpasswd }}"
zmbackup_backup_dir: /opt/zimbra/backup
zmbackup_metadata_dir: ""
zmbackup_mail_alert: "admin@{{ domain }}"
zmbackup_mail_sender: "root@{{ domain }}"
zmbackup_parallel_process: 3
zmbackup_rotate_days: 30
zmbackup_lock_backup: true

zmbackup_environment:
  OSE_INSTALL_DOMAIN: "{{ domain }}"
  OSE_INSTALL_ADDRESS: "{{ zmbackup_server_address }}"
  OSE_DEFAULT_BKP_DIR: "{{ zmbackup_backup_dir }}"
  ZMBKP_METADATA_DIR: "{{ zmbackup_metadata_dir }}"
  ZMBKP_REST_ADMIN: "{{ zmbackup_admin_user }}"
  ZMBKP_REST_ADMIN_PASS: "{{ zmbackup_admin_password }}"
  ZMBKP_MAIL_ALERT: "{{ zmbackup_mail_alert }}"
  ZMBKP_MAIL_SENDER: "{{ zmbackup_mail_sender }}"
  MAX_PARALLEL_PROCESS: "{{ zmbackup_parallel_process }}"
  ROTATE_TIME: "{{ zmbackup_rotate_days }}"
  LOCK_BACKUP: "{{ zmbackup_lock_backup | zimbra_bool | lower }}"
