---
# Name of this server in Zimbra
zimbra_server_name: "{{ hostname }}.{{ domain }}"

# Installer build for this distribution, empty when zm_repo has none
zimbra_build: >-
  {{ zm_repo[zimbra_version | string].builds[ansible_distribution | lower][ansible_distribution_major_version | int]
     | default('') }}

# Tags of the Zimbra sources a version is built from, newest first. Each
# component of Zimbra is only tagged in the patches that changed it, so the
# build uses the first of these tags each component has (10.1.15, 10.1.14...
# 10.1.0, 10.1.0-GA)
zimbra_version_parts: "{{ (zimbra_version | string).split('.') }}"
zimbra_source_tags: >-
  {{ range(zimbra_version_parts[2] | int, -1, -1)
     | map('regex_replace', '^', zimbra_version_parts[0] ~ '.' ~ zimbra_version_parts[1] ~ '.')
     | list + [zimbra_version_parts[0] ~ '.' ~ zimbra_version_parts[1] ~ '.0-GA'] }}

# Folder the version is built in
zimbra_source_build_dir: "{{ zimbra_source_dir }}/{{ zimbra_version }}"

# Packages in the order the installer asks for them
zimbra_packages:
  - {name: zimbra-ldap, enabled: "{{ zimbra_ldap }}"}
  - {name: zimbra-logger, enabled: "{{ zimbra_logger }}"}
  - {name: zimbra-mta, enabled: "{{ zimbra_mta }}"}
  - {name: zimbra-dnscache, enabled: "{{ zimbra_dnscache }}"}
  - {name: zimbra-snmp, enabled: "{{ zimbra_snmp }}"}
  - {name: zimbra-store, enabled: "{{ zimbra_store }}"}
  - {name: zimbra-apache, enabled: "{{ zimbra_apache }}"}
  - {name: zimbra-spell, enabled: "{{ zimbra_spell }}"}
  - {name: zimbra-memcached, enabled: "{{ zimbra_memcached }}"}
  - {name: zimbra-proxy, enabled: "{{ zimbra_proxy }}"}

# Ports opened by zimbra_firewall, as port/protocol
zimbra_firewall_mta_ports:
  - 25/tcp    # SMTP
  - 465/tcp   # SMTPS
  - 587/tcp   # Submission
# Served by the proxy, or by the mailbox when there is no proxy
zimbra_firewall_mail_ports:
  - 80/tcp    # HTTP, redirected to HTTPS
  - 443/tcp   # HTTPS
  - 110/tcp   # POP3
  - 995/tcp   # POP3S
  - 143/tcp   # IMAP
  - 993/tcp   # IMAPS
zimbra_firewall_ports: >-
  {{ ((zimbra_firewall_mta_ports if zimbra_mta | zimbra_bool else [])
      + (zimbra_firewall_mail_ports if zimbra_proxy | zimbra_bool or zimbra_store | zimbra_bool else [])
      + (['7071/tcp'] if zimbra_firewall_admin | zimbra_bool and zimbra_store | zimbra_bool else [])
      + (['9071/tcp'] if zimbra_firewall_admin | zimbra_bool and zimbra_proxy | zimbra_bool else [])
      + zimbra_firewall_extra_ports) | unique }}

# zmlocalconfig settings set to true on the MTA
zimbra_antispam_settings:
  # SpamAssassin Auto Update
  - antispam_enable_rule_updates
  # Restart Amavis when the rules are updated
  - antispam_enable_restarts
  # SpamAssassin rule compilation
  - antispam_enable_rule_compilation

# Domain settings for the logos (zmlogologin and zmlogoapp)
zimbra_logo_settings:
  # Where the logos link to
  - {name: zimbraSkinLogoURL, value: "https://{{ zimbra_server_name }}"}
  - {name: zimbraSkinLogoLoginBanner, value: /img/logoLoginBanner.png}
  - {name: zimbraSkinLogoAppBanner, value: /img/logoAppBanner.png}
