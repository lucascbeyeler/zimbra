---
- name: Restart Zimbra
  ansible.builtin.shell: source /opt/zimbra/.bashrc && ./zmcontrol restart
  args:
    executable: /bin/bash
    chdir: /opt/zimbra/bin/
  become: true
  become_user: zimbra
  register: zimbra_restart
  retries: 3
  delay: 10
  until: zimbra_restart is succeeded
  changed_when: true

- name: Restart systemd-resolved
  ansible.builtin.service:
    name: systemd-resolved
    state: restarted
